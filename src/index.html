<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPD Industries · Ujjain Plant — 3D Model</title>
  <style>
    :root { --panel: rgba(9, 22, 38, 0.88); --line: rgba(255, 255, 255, 0.12); --text: #e8eef6; --muted: #9fb3c8; --accent: #00a3e0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b1a2b; color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
    canvas#gl:active { cursor: grabbing; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; pointer-events: none; text-align: center; padding: 24px; }
    #status.hidden { display: none; }
    #panel {
      position: fixed; top: 12px; left: 12px; width: 232px; max-height: calc(100vh - 24px); overflow: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
      backdrop-filter: blur(6px); display: none;
    }
    #panel.ready { display: block; }
    #panel h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: 0.02em; }
    #panel .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; }
    #panel h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 14px 0 6px; }
    #views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button {
      appearance: none; border: 1px solid var(--line); border-radius: 6px; background: rgba(255, 255, 255, 0.06); color: var(--text);
      font: 600 12px/1 inherit; padding: 8px 6px; cursor: pointer;
    }
    button:hover { background: rgba(0, 163, 224, 0.28); border-color: var(--accent); }
    label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; user-select: none; }
    label i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    input[type="checkbox"] { accent-color: var(--accent); margin: 0; }
    #help { color: var(--muted); font-size: 11px; margin-top: 12px; line-height: 1.5; }
    #collapse { position: fixed; top: 12px; left: 252px; z-index: 3; display: none; padding: 8px 10px; }
    #collapse.ready { display: block; }
    #panel.min { display: none; }
    #info { position: fixed; right: 12px; bottom: 12px; color: rgba(255, 255, 255, 0.75); font-size: 11.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: none; }
    #info.ready { display: block; }
    @media (max-width: 560px) { #panel { width: 200px; } #collapse { left: 220px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="status">Loading 3D model…</div>
  <aside id="panel" aria-label="Model controls">
    <h1>MPD Industries · Ujjain</h1>
    <div class="sub">Interactive 3D plant model</div>
    <h2>Views</h2>
    <div id="views"></div>
    <h2>Open up</h2>
    <div id="cutaways"></div>
    <h2>Layers</h2>
    <div id="layers"></div>
    <h2>Pipe flows</h2>
    <div id="flows"></div>
    <div style="margin-top:12px"><button id="replay" type="button" style="width:100%">Replay build-up</button></div>
    <div id="help">Drag to orbit · right-drag / two fingers to pan · scroll or pinch to zoom · double-click to focus a point</div>
  </aside>
  <button id="collapse" type="button" aria-label="Toggle panel">☰</button>
  <div id="info"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
