<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MPD Ujjain Showcase Renderer</title>
  <style>
    /* Default / headless: full-bleed 1920×1080 canvases for Playwright capture */
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
    #preview, #status { display: none; }
    body:not(.interactive) #viewport,
    body:not(.interactive) #stage { display: contents; }

    /* Interactive browser preview (body.interactive set by preview.js) */
    body.interactive {
      background: #0a0a0a; height: 100%; font-family: system-ui, sans-serif;
    }
    body.interactive #viewport {
      display: flex; align-items: center; justify-content: center;
      width: 100vw; height: 100vh; padding-bottom: 56px; box-sizing: border-box;
    }
    body.interactive #stage {
      display: block; width: 1920px; height: 1080px; position: relative;
      transform-origin: center center; background: #000;
    }
    body.interactive #stage canvas {
      position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block;
    }
    body.interactive #preview {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
      align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box;
      background: rgba(12, 14, 18, 0.92); color: #e8eaed;
      border-top: 1px solid rgba(255,255,255,0.08); z-index: 10;
    }
    body.interactive #preview.hidden { display: none; }
    body.interactive #preview button {
      appearance: none; border: 0; border-radius: 6px;
      background: #1f6feb; color: #fff; font: 600 13px/1 system-ui, sans-serif;
      padding: 8px 14px; cursor: pointer; min-width: 72px;
    }
    body.interactive #preview button:hover { background: #2a7fff; }
    body.interactive #preview input[type="range"] { flex: 1; accent-color: #1f6feb; }
    body.interactive #preview #time {
      font: 500 12px/1 ui-monospace, Menlo, monospace; min-width: 88px; opacity: 0.85;
    }
    body.interactive #status {
      display: grid; place-items: center; position: fixed; inset: 0;
      color: #9aa0a6; font: 500 14px/1.4 system-ui, sans-serif; z-index: 5;
      pointer-events: none;
    }
    body.interactive #status.hidden { display: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="status">Loading 3D scene…</div>
  <div id="viewport">
    <div id="stage">
      <canvas id="gl" width="1920" height="1080"></canvas>
      <canvas id="hud" width="1920" height="1080"></canvas>
    </div>
  </div>
  <div id="preview" class="hidden">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="180" step="0.1" value="15" />
    <span id="time">0:15.0</span>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/preview.js"></script>
</body>
</html>
